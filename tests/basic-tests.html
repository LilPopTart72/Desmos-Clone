<!-- Add this so core.js can find #graph -->
<canvas id="graph" width="400" height="400" style="display:none;"></canvas>

log("=== Testing parsePoint ===");
let p = GraphUtils.parsePoint("(3,4)");
log("parsePoint('(3,4)') => x=" + p.x + " y=" + p.y);
p = GraphUtils.parsePoint("(0,0)");
log("parsePoint('(0,0)') => x=" + p.x + " y=" + p.y);
p = GraphUtils.parsePoint("(10000000,-10000000)");
log("parsePoint('(10000000,-10000000)') => x=" + p.x + " y=" + p.y);

log("parsePoint('(100000000.0000,-10000000.0000)') => x=" + p.x + " y=" + p.y);
p = GraphUtils.parsePoint("10,-10");
log("parsePoint('10,-10') => x=" + p.x + " y=" + p.y);
p = GraphUtils.parsePoint("( 5 , - 10 )");
log("parsePoint('( 10 , - 10 )') => x=" + p.x + " y=" + p.y);
p = GraphUtils.parsePoint("(10 ,-- 10)");
log("parsePoint('(10 ,-- 10)') => x=" + p.x + " y=" + p.y);

log("f(0.5) = " + f(0.5)); // Expect 3
log("f(1) = " + f(1)); // Expect 5
log("f(2) = " + f(2)); // Expect 7
