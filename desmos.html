<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Desmos Clone</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Desmos Clone</h1>


        <div class="row">
            <div class="plotter">
                <h3>Functions (y = mx + b)</h3>
                <div class="col card" id="card1">
                    <input id="plot1" type="text"  value="y=asin(bx+c)"placeholder="(x, y) or y = mx^2 + b">
                    <h3 id="slider1text">A: 0 B: 0 C: 0</h3>
                    <input type="range" id="a1slider" min="-10" max="10" step="0.001" value="1"/>
                    <input type="range" id="b1slider" min="-10" max="10" step="0.001" value="1"/>
                    <input type="range" id="c1slider" min="-10" max="10" step="1" value="1"/>
                </div>
                <div class="col card" id="card2">
                    <input id="plot2" type="text"  value="y=ax^3+bx^2+cx"placeholder="(x, y) or y = mx^2 + b">
                    <h3 id="slider2text">A: 0 B: 0 C: 0</h3>
                    <input type="range" id="a2slider" min="-10" max="10" step="0.001" value="1"/>
                    <input type="range" id="b2slider" min="-10" max="10" step="0.001" value="1"/>
                    <input type="range" id="c2slider" min="-10" max="10" step="1" value="1"/>
                </div>

                <div class="col card" id="card3">
                    <input id="plot3" type="text"  placeholder="(x, y) or y = mx^2 + b">
                    <h3 id="slider3text">A: 0 B: 0 C: 0</h3>
                    <input type="range" id="a3slider" min="-10" max="10" step="0.01" value="1"/>
                    <input type="range" id="b3slider" min="-10" max="10" step="0.01" value="1"/>
                    <input type="range" id="c3slider" min="-10" max="10" step="1" value="1"/>
                </div>

                <div class="col card" id="card4">
                    <input id="plot4" type="text"  placeholder="(x, y) or y = mx^2 + b">
                    <h3 id="slider4text">A: 0 B: 0 C: 0</h3>
                    <input type="range" id="a4slider" min="-10" max="10" step="0.01" value="1"/>
                    <input type="range" id="b4slider" min="-10" max="10" step="0.01" value="1"/>
                    <input type="range" id="c4slider" min="-10" max="10" step="1" value="1"/>
                </div>

                <div class="col card" id="card5">
                    <input id="plot5" type="text"  placeholder="(x, y) or y = mx^2 + b">
                    <h3 id="slider5text">A: 0 B: 0 C: 0</h3>
                    <input type="range" id="a5slider" min="-10" max="10" step="0.01" value="1"/>
                    <input type="range" id="b5slider" min="-10" max="10" step="0.01" value="1"/>
                    <input type="range" id="c5slider" min="-10" max="10" step="1" value="1"/>
                </div>

                
            </div>
            <canvas id="graph"></canvas>
        </div>

    
        <script src="script.js" async defer></script>
    </body>
</html>
